# =====================================================================
# Rubrique de diagnostic — Persona 1 : détaillant / installateur HVAC
# =====================================================================
# CECI EST DE LA DONNÉE, PAS DU CODE. Le moteur de scoring est générique.
# Pour le persona 2 (cabinet d'avocats), tu dupliques ce fichier en
# rubric_persona2.yaml et tu changes les dimensions/poids/checks.
# Tu ne touches JAMAIS scoring.py.
#
# CE QUE MESURE CETTE RUBRIQUE
# ----------------------------
# Elle ne note pas une entreprise « en général » : elle mesure un BESOIN.
# Un score BAS = un prospect CHAUD (beaucoup à corriger, donc beaucoup de
# valeur à apporter). Un score HAUT = une entreprise qui n'a pas besoin de
# la consultante. C'est l'inverse d'une note de satisfaction, et c'est
# volontaire.
#
# Corollaire à garder en tête : le score se lit TOUJOURS avec sa couverture
# (`_couverture`, publiée par le moteur). Un 30/100 observé à 100 % est un
# prospect qualifié ; un 30/100 observé à 40 % est une hypothèse.
#
# LES POIDS SONT LE JUGEMENT MÉTIER DE LA CONSULTANTE
# ---------------------------------------------------
# Ils sont faits pour être ajustés par elle, pas par un développeur. Total = 100.
#
# CHAQUE CHECK DÉCLARE SA GRAVITÉ
# --------------------------------
# `gravite: haute | moyenne | basse` — c'est un jugement commercial explicite.
# Elle n'est plus déduite du poids relatif : cette déduction dépendait du
# nombre de checks voisins et classait « Site web inaccessible » en `moyenne`
# parce qu'il cohabitait avec cinq autres checks.
# La faille `haute` la mieux placée devient l'accroche envoyée au prospect
# (`signal_chaud`) : une gravité mal réglée se voit donc directement dans
# le message commercial.
#
# UN SIGNAL NON OBSERVÉ NE PRODUIT AUCUNE FAILLE
# -----------------------------------------------
# Si un collecteur est en mode dégradé (pas de clé API, source injoignable),
# son signal vaut `None` et le moteur s'abstient : ni point, ni dénominateur,
# ni faille. C'est pourquoi aucun libellé de `gap` ci-dessous ne porte plus
# la mention « à confirmer » : un gap n'est émis que s'il a été OBSERVÉ.
#
# Opérateurs disponibles : is_true | gte | lte | exists | non_vide
#
# ADR 0004 — deux ajouts À CE FICHIER, tous deux côté BESOIN (un état, pas
# un événement daté — voir knowledge/intent_persona1.yaml pour l'axe
# intention, un fichier SÉPARÉ, jamais scoré par ce moteur) :
#   1. `legitimite_conformite` (nouvelle dimension, §D8 « Retenu 2 ») :
#      licence professionnelle / programme de subvention affichés par
#      l'entreprise elle-même — zéro appel réseau, dérivé du HTML déjà en
#      mémoire (diagnostic/collectors/legitimite.py).
#   2. `reviews.date_dernier_avis` sous `avis` (§D7, reclassé depuis
#      l'intention : « une note Google basse ne vieillit pas », donc un état,
#      jamais un événement — pur ajout YAML, zéro nouveau code, le champ est
#      déjà produit par reviews.py, déjà jeté aujourd'hui).
# Poids rééquilibrés pour garder un total de 100 (site_web 25→20,
# presence_locale 20→15) : [À CALIBRER] par la consultante, comme le reste
# de ce fichier — ce rééquilibrage est un point de départ, pas une mesure.

persona: "Détaillant / installateur HVAC (climatisation, chauffage, PAC)"

dimensions:

  # -------------------------------------------------------------------
  # Le site est la vitrine. Un propriétaire compare trois soumissions et
  # écarte en 90 secondes celui qui ne le rassure pas.
  # -------------------------------------------------------------------
  site_web:
    poids: 20
    checks:
      - { signal: website.reachable,           op: is_true, points: 20, gravite: haute,   gap: "Site web inaccessible ou inexistant" }
      - { signal: website.https,               op: is_true, points: 10, gravite: moyenne, gap: "Pas de HTTPS — signal de confiance manquant" }
      # Le mobile n'est pas un confort : la recherche d'un installateur se
      # fait au téléphone, souvent en urgence (panne de chauffage).
      - { signal: website.has_viewport,        op: is_true, points: 15, gravite: haute,   gap: "Site non optimisé pour mobile" }
      - { signal: website.has_meta_description, op: is_true, points: 10, gravite: basse,  gap: "Métadonnées SEO de base absentes" }
      - { signal: website.mentions_offre,      op: is_true, points: 25, gravite: haute,   gap: "L'offre (clim / chauffage / PAC) n'est pas clairement présentée" }
      - { signal: website.has_contact,         op: is_true, points: 20, gravite: haute,   gap: "Pas de moyen de contact visible" }

  # -------------------------------------------------------------------
  # Palier 1 (Google Places). Sans clé API, ces signaux valent None et la
  # dimension sort proprement du calcul au lieu de le fausser.
  # -------------------------------------------------------------------
  presence_locale:
    poids: 15
    checks:
      - { signal: gbp.verified,    op: is_true, points: 60, gravite: haute,   gap: "Fiche d'établissement non vérifiée" }
      - { signal: gbp.has_photos,  op: is_true, points: 40, gravite: moyenne, gap: "Aucune photo sur la fiche d'établissement" }

  # -------------------------------------------------------------------
  # La preuve sociale décide de l'appel. `repond_aux_avis` est déjà collecté
  # par reviews.py et n'était pas exploité : c'est un signal de négligence
  # très discriminant, et il ne coûte aucun appel supplémentaire.
  # -------------------------------------------------------------------
  avis:
    poids: 20
    checks:
      - { signal: reviews.count,          op: gte, value: 10,  points: 40, gravite: haute,   gap: "Moins de 10 avis — preuve sociale faible" }
      - { signal: reviews.avg,            op: gte, value: 4.0, points: 40, gravite: haute,   gap: "Note moyenne sous 4,0" }
      - { signal: reviews.repond_aux_avis, op: is_true, points: 20, gravite: moyenne, gap: "Les avis clients restent sans réponse" }
      # ADR 0004 §D7 : proxy de fraîcheur de la réputation, reclassé depuis
      # l'intention (un état, pas un événement daté — ne "vieillit" pas au
      # sens de la décroissance). `exists` : la seule vérification possible
      # sans nouveau code (une comparaison "depuis combien de jours" exigerait
      # un champ dérivé numérique que reviews.py ne produit pas aujourd'hui).
      - { signal: reviews.date_dernier_avis, op: exists, points: 20, gravite: basse, gap: "Aucune date de dernier avis connue — activité en ligne dormante" }

  seo_local:
    poids: 15
    checks:
      - { signal: website.has_title,   op: is_true, points: 40, gravite: moyenne, gap: "Balise <title> absente ou vide" }
      - { signal: seo.local_keywords,  op: is_true, points: 60, gravite: haute,   gap: "Aucun mot-clé géolocalisé détecté" }

  identite_visuelle:
    poids: 10
    checks:
      - { signal: website.has_logo,    op: is_true,            points: 50, gravite: moyenne, gap: "Pas de logo clairement identifiable" }
      - { signal: website.image_count, op: gte, value: 3,      points: 50, gravite: basse,   gap: "Très peu de visuels — identité de marque pauvre" }

  # -------------------------------------------------------------------
  # DIMENSION D'ENTRETIEN — le signal de besoin le plus honnête.
  # Une entreprise dont le site n'a pas bougé depuis des années n'a pas un
  # problème d'esthétique : elle a cessé d'investir dans sa marque. C'est
  # exactement le prospect que la consultante cherche.
  # Les deux signaux sont DÉJÀ collectés (website.py, social.py) et étaient
  # jetés : coût API marginal nul.
  # -------------------------------------------------------------------
  entretien:
    poids: 10
    checks:
      - { signal: website.fraicheur_mois,           op: lte, value: 18, points: 60, gravite: haute,   gap: "Site sans mise à jour depuis plus de 18 mois" }
      - { signal: social.plateformes_mentionnees,   op: non_vide,       points: 40, gravite: moyenne, gap: "Aucune présence sociale reliée depuis le site" }

  # -------------------------------------------------------------------
  # ADR 0004 §D8 « Retenu 2 » — legitimite.py (palier 0, zéro appel réseau
  # de plus). Une licence professionnelle affichée est un ÉTAT (elle reste
  # vraie tant qu'elle n'est pas retirée), jamais un événement daté : cette
  # dimension reste côté BESOIN, pas intention (cohérent avec §B1).
  # Motifs en donnée (knowledge/certifications_{marche}.yaml), jamais en dur.
  # -------------------------------------------------------------------
  legitimite_conformite:
    poids: 10
    checks:
      - { signal: legitimite.licence_professionnelle, op: is_true, points: 60, gravite: haute, gap: "Aucune licence professionnelle affichée (RBQ, maître mécanicien...)" }
      - { signal: legitimite.programme_subvention,     op: is_true, points: 40, gravite: basse, gap: "Aucun programme de subvention en vigueur mentionné" }
